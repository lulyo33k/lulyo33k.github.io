<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Redirection</title>
</head>
<body>
    <p>Redirection...</p>

    <script>
        const redirects = {
            "/discord": "https://discord.gg/NnF3RSWywT",
            "/youtube": "https://youtube.com/@NiesYTB",
            "/twitch": "https://twitch.tv/niesytb"
            "/therms": "https://lulyo.ecloudserv.fr/therms",
            "/site": "https://lulyo.ecloudserv.fr",
            "/free-admin": "https://www.youtube.com/watch?v=Aq5WXmQQooo",
        };

        const path = window.location.pathname;

        if (redirects[path]) {
            window.location.replace(redirects[path]);
        } else {
            document.body.innerHTML = "<h1>404</h1><p>Lien inconnu.</p>";
        }
    </script>
</body>
</html>
